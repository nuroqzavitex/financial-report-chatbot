name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"
  PYTHON_VERSION: "3.11"

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      # never `ruff format .` at the root: it would rewrite code blocks in docs/*.md
      - run: uv run ruff format --check packages apps eval
      - run: uv run mypy
      - run: uv run lint-imports
      # default suite: no API key, no Ollama (fakes), golden tests on the committed PDF
      - run: uv run pytest -q

  integration:
    name: Integration (Qdrant server + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\r\n\r\n\" >&3 && grep -q \"200 OK\" <&3'"
          --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ircb
          POSTGRES_PASSWORD: ircb
          POSTGRES_DB: ircb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ircb -d ircb"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      QDRANT_URL: http://localhost:6333
      DATABASE_URL: postgresql+psycopg://ircb:ircb@localhost:5432/ircb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # the integration conftest skips when a service is unreachable; here both must be up
      - run: uv run pytest -q -m integration -rs

  web:
    name: Web (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  publish:
    name: Publish images to ghcr.io
    if: github.event_name == 'push'
    needs: [python, integration, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/api.Dockerfile
          - image: web
            dockerfile: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # main -> latest + sha; tag v1.2.3 -> 1.2.3 and 1.2
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
