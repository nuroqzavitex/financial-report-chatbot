[project]
name = "ircb"
version = "0.1.0"
description = "Vietnamese annual-report Q&A core"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pymupdf>=1.24",
    "qdrant-client==1.19.1",
    "sqlalchemy>=2.0",
    "alembic",
    "litellm",
    "pydantic>=2",
    "pydantic-settings",
    "pyarrow",
    "structlog",
    "psycopg[binary]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ircb"]
