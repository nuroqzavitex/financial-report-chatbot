[project]
name = "ircb-cli"
version = "0.1.0"
description = "ircb command line interface"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ircb",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "typer",
]

[project.scripts]
ircb = "ircb_cli.main:app"

[tool.uv.sources]
ircb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ircb_cli"]
