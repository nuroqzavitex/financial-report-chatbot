[project]
name = "ircb-api"
version = "0.1.0"
description = "ircb HTTP API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.143.3",
    "ircb",
    "pyjwt[crypto]>=2.15.0,<2.16",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
ircb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ircb_api"]
